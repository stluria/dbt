sources:
  - name: jaffle_shop
    description: A clone of a Postgres database
    database: dbt-tutorial
    schema: jaffle_shop  

    tables:
      - name: orders
        description: Raw customers data
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
      - name: customers
        columns:
          - name: id
            data_tests:
              - unique
              - not_null

  - name: stripe
    tables:
      - name: payments
        